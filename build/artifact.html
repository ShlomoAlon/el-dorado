<title>El Dorado Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a1310; --glass:rgba(12,21,18,.9); --glass2:rgba(22,34,29,.92); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#ecf1ec; --muted:#98aa9f; --faint:#62756a;
  --gold:#e9b24a; --gold2:#f8dc97; --goldInk:#3a2807; --danger:#e8634f;
  --display:'Young Serif', Georgia, 'Times New Roman', serif;
  --ui:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --cw:132px;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;width:100%;overflow:hidden;overflow:clip;touch-action:none}
html,body{overflow:clip;overscroll-behavior:none}

/* ---------- board */
#vp{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 45% 42%,#18291f 0%,#0e1a15 55%,#080f0c 100%);touch-action:none;cursor:grab}
#vp::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%)}
#vp.drag{cursor:grabbing}
/* the board layer: always composited (see applyView); #bscale carries the scale baked in once a zoom settles */
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#bscale{position:relative;transform-origin:0 0}
#board{display:block;overflow:visible}
#board2{position:absolute;left:0;top:0;overflow:visible}
#blabels,#blabels2{position:absolute;left:0;top:0;pointer-events:none}.blabel{position:absolute;white-space:nowrap;line-height:1}
.tgt{cursor:pointer}
.tgt .ring{fill:rgba(255,228,150,.14);stroke:var(--gold2);stroke-width:3;transition:fill .12s}
.tgt:hover .ring,.tgt.hot .ring{fill:rgba(255,228,150,.42)}
.tgt.dis .ring{fill:rgba(255,255,255,.07);stroke:#fff;stroke-dasharray:6 5;stroke-width:2}
.tgt.dis:hover .ring,.tgt.dis.hot .ring{fill:rgba(255,255,255,.22)}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.4}}
.bl-badge.tgt .bl-halo{stroke:var(--gold2);stroke-width:3}
.bl-badge.hot .bl-halo{stroke-width:5;animation:none}
.piece{cursor:pointer}
.piece .turnfx{opacity:0;transition:opacity .3s ease}.piece.turn .turnfx{opacity:1}
#tip{position:absolute;pointer-events:none;background:rgba(8,14,12,.95);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;font-size:12.5px;white-space:nowrap;opacity:0;transform:translate(-50%,-135%);transition:opacity .12s;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.4)}
#tip b{color:var(--gold2)}

/* ---------- HUD */
/* no backdrop-filter on anything that floats over the board: a live blur is recomputed every frame the board moves */
.glass{background:var(--glass);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:10px;padding:12px 16px;pointer-events:none;z-index:20}
#hud>*{pointer-events:auto}
.brandbox{display:flex;align-items:baseline;gap:10px;padding:8px 14px;border-radius:12px;white-space:nowrap}
.brand{font-family:var(--display);font-size:19px;color:var(--gold2)}
#roundLbl{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#players{display:flex;gap:8px;flex:1;min-width:0;justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pchip{display:flex;align-items:center;gap:8px;padding:6px 11px 6px 8px;border-radius:12px;white-space:nowrap;font-size:13px;transition:border-color .3s,box-shadow .3s,transform .3s var(--ease)}
.pchip.on{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset,0 10px 30px rgba(0,0,0,.35);transform:translateY(1px)}
.pchip .dot{width:14px;height:14px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px rgba(0,0,0,.45) inset}
.pchip .nm{font-weight:700}
.pchip .st{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.pchip .bk{display:flex;gap:4px}
.pchip .bk i{width:9px;height:9px;border-radius:2px;display:block;transform:rotate(45deg);box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.pchip .fin{color:var(--gold);font-weight:800;font-size:12px}
.hbtns{display:flex;gap:8px}
.tbtn{border-radius:11px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.tbtn:hover{background:var(--glass2)}
.tbtn.on{border-color:var(--gold);color:var(--gold2)}
.tbtn.ico{padding:8px 10px;display:inline-grid;place-items:center}
.tbtn.ico svg{display:block}
#jrnBtn{display:inline-flex;align-items:center;gap:6px}#jrnBtn svg{flex:none;color:var(--gold2)}
#fsBtn .fs-out,#fsBtn.full .fs-in{display:none}
#fsBtn.full .fs-out{display:inline}
#sndBtn .snd-off,#sndBtn.off .snd-on{display:none}
#sndBtn.off .snd-off{display:inline}
#sndBtn.off{opacity:.7}
.tbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* centred in the space left of the market column (--mktFoot = how far the market reaches in from the right edge) */
#app{--mw:72px;--mktR:16px;--mktW:152px;--mktFoot:calc(var(--mktR) + var(--mktW) + 10px);--zoomFoot:66px}
#app.replaying #prompt{display:none}
#app:has(#mkt.hid),#app:has(#mkt.cramped){--mktFoot:16px}
#mkt.cramped{display:none}
#prompt{position:absolute;left:var(--zoomFoot);right:var(--mktFoot);margin-inline:auto;width:max-content;box-sizing:border-box;top:64px;max-width:min(760px,calc(100% - var(--zoomFoot) - var(--mktFoot)));padding:9px 16px;border-radius:12px;font-size:14px;color:#dbe4de;z-index:15;text-align:center;line-height:1.4;transition:opacity .2s}
#prompt b{color:var(--gold2)}
#prompt .who{display:inline-flex;align-items:center;gap:7px;font-weight:800;margin-right:8px;color:var(--text)}
#prompt .who i{width:11px;height:11px;border-radius:50%}
#prompt .m{color:var(--muted)}
/* another player's turn: their cards in a row under the prompt text (ui_view.js feedRender); newest on the right, the oldest clip */
#feed{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px -6px 0;padding-top:8px;border-top:1px solid var(--line);--fw:52px}
#feed[hidden]{display:none}
#feed .fwho{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--text);white-space:nowrap;flex:none}
#feed .fwho[hidden]{display:none}
#feed .fwho i{width:9px;height:9px;border-radius:50%}
#feed .frow{display:flex;align-items:flex-end;justify-content:flex-end;gap:18px;min-width:0;overflow:hidden;padding:2px 2px 0}
#feed .fg.gone{display:none}
.fg{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.fg.new{animation:fgIn .32s var(--ease) backwards}
@keyframes fgIn{from{opacity:0;transform:translateY(-6px) scale(.94)}}
.fg .frc{display:flex;align-items:center}
.fg .fcs{display:flex}
.fc{width:var(--fw);height:calc(var(--fw)*1.4);flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));transition:opacity .15s}
.fc .mcard{--cw:var(--fw)}
.fcs .fc+.fc{margin-left:calc(var(--fw)*-.42)}
.fc.got .cface{box-shadow:0 0 0 2px var(--gold2),0 0 12px rgba(233,178,74,.45)}
.fg .farr{font-size:20px;line-height:1;color:var(--gold2);margin:0 4px;font-weight:800}
.f-camp .fc .cface,.f-trash .fc .cface{box-shadow:0 0 0 2px #e08a74}
.fg .fcap{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;line-height:1.2}
.fg .fcap b{color:var(--text)}
.fend{align-self:center}
.fend .fpill{font-size:11px;font-weight:800;color:var(--text);border:1px solid var(--line2);border-radius:9px;padding:3px 9px;background:rgba(255,255,255,.04)}
.timer{display:inline-block;font-variant-numeric:tabular-nums;font-weight:800;padding:1px 9px;border-radius:8px;background:rgba(255,255,255,.08);margin-right:10px;color:var(--gold2);transition:background .2s,color .2s}
.timer.low{background:rgba(232,99,79,.28);color:#ffb3a5;animation:pulse 1s ease-in-out infinite}

/* ---------- market: six cards floating over the top of the board, plus an "all cards" spread */
#mkt{position:absolute;right:var(--mktR);top:66px;z-index:16;transition:transform .35s var(--ease),opacity .25s}
#mkt.hid{transform:translateX(30px);opacity:0;pointer-events:none}
#market{display:grid;grid-template-columns:repeat(2,var(--mw));gap:10px 8px}
#mkt .mslot{filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
#mkt .mslot{transform-origin:100% 25%}
#mkt .mslot:hover{transform:scale(1.9);z-index:6}
.mslot{position:relative;cursor:pointer;transition:transform .2s var(--ease);transform-origin:50% 0}
.mslot .mcard{--cw:var(--mw)}
.mslot.no{cursor:default}
/* affordable cards are bright with a small tag; everything else sits back (static, no animation) */
.mslot.dimc .mcard{filter:brightness(.55) saturate(.7)}
.mslot.can .cface{box-shadow:0 0 0 2px #8fe3a8,0 .25em .6em rgba(0,0,0,.45)}
.mslot.can::after{content:'Can buy';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);background:#8fe3a8;color:#0d2a18;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:1px 7px;border-radius:9px;white-space:nowrap;z-index:4;pointer-events:none}
.mslot.chosen .cface{box-shadow:0 0 0 2px var(--gold2),0 0 20px rgba(233,178,74,.5)}
.mslot.empty{width:var(--mw);height:calc(var(--mw)*1.4);border:1.5px dashed var(--line2);border-radius:9px;display:grid;place-items:center;color:var(--faint);font-size:10.5px;text-align:center;cursor:default;line-height:1.3;background:rgba(8,14,12,.45)}
.alltile{width:var(--mw);height:calc(var(--mw)*1.4);border-radius:9px;border:1.5px solid var(--line2);background:rgba(10,18,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--text);font:800 12px var(--ui);cursor:pointer;text-align:center;line-height:1.2;padding:4px;position:relative;transition:border-color .15s,background .15s}
.alltile:hover{border-color:var(--gold);background:rgba(20,32,27,.78)}
.alltile svg{width:26px;height:26px;color:var(--gold2)}
.alltile small{font-weight:600;color:var(--muted);font-size:10px}
.alltile.open small{color:var(--gold2)}
.alltile.can{border-color:#8fe3a8}
.alltile.can small{color:#8fe3a8}
#mktBtn.canbuy{box-shadow:0 0 0 1.5px #8fe3a8}
.mcard{--cw:86px;position:relative;width:var(--cw);height:calc(var(--cw)*1.4);font-size:calc(var(--cw)*.1)}
.cnt{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;border-radius:11px;background:#0a1210;border:1px solid var(--line2);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums;z-index:4}
#allc{position:absolute;inset:0;z-index:40;background:rgba(4,9,7,.76);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow-y:auto;overscroll-behavior:contain;animation:fade .2s}
#allc[hidden]{display:none}
.allc-in{max-width:1080px;margin:0 auto;padding:64px 20px 40px}
.allc-sect{margin-top:18px}
.allc-sect h3,.allc-head h2{font-family:var(--display);font-weight:400;display:flex;align-items:baseline;gap:12px;margin:0 0 14px;color:var(--gold2)}
.allc-head h2{font-size:26px}
.allc-sect h3{font-size:18px;color:var(--text)}
.allc-sect h3 span,.allc-head span{font-family:var(--ui);font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.agrid{display:flex;flex-wrap:wrap;gap:22px 16px;--mw:112px}
.agrid .mslot{filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));animation:rise .3s var(--ease) backwards}
.agrid .mslot:hover{transform:translateY(-4px)}
#allClose{position:fixed;top:14px;right:16px;z-index:41;width:36px;height:36px;font-size:17px}
.sclose{width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center;font-size:15px;color:var(--muted)}
.sclose:hover{color:var(--text)}
.note{font-size:11.5px;color:var(--muted);margin:8px 0 0;line-height:1.4}
/* journal (game log): its own HUD button opens it; it stays live while open. No backdrop blur: the board may move under it */
.scrim.plain{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(4,8,7,.7)}
.modal.jrn{display:flex;flex-direction:column;padding:22px 22px 18px;max-height:min(720px,calc(100% - 32px))}
.modal.jrn h2{display:flex;align-items:baseline;gap:12px}
.modal.jrn h2 span{font-family:var(--ui);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
#log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;font-size:13.5px;line-height:1.45;color:#c7d3cc;margin:6px -6px 0;padding:0 6px}
#log .lr{position:sticky;top:0;background:#121d19;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);padding:10px 0 5px;border-bottom:1px solid var(--line2)}
#log .le{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#log .le.sys{color:var(--muted);font-style:italic}
#log i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}

/* ---------- bottom controls */
.pile{position:absolute;bottom:16px;z-index:12;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);cursor:pointer}
#deckPile{left:16px}
#discPile{right:16px}
.pile .lbl{font-variant-numeric:tabular-nums;white-space:nowrap;padding:3px 9px;border-radius:9px}
.pile .lbl b{color:var(--text)}
.pstack{position:relative;width:74px;height:104px}
.back{position:absolute;inset:0;border-radius:8px;background:radial-gradient(circle at 50% 50%,#2c4a38 0 30%,transparent 31%),repeating-linear-gradient(45deg,#1d3628 0 5px,#183021 5px 10px);border:1px solid #3d6049;box-shadow:inset 0 0 0 3px #122419,inset 0 0 0 4px rgba(233,178,74,.4),0 3px 0 #06100b,0 10px 18px rgba(0,0,0,.45)}
.back::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:2px solid rgba(233,178,74,.6);box-shadow:0 0 0 5px rgba(233,178,74,.12)}
.back.b2{transform:translate(3px,-3px);opacity:.9}
.back.b3{transform:translate(6px,-6px);opacity:.8}
.empty-slot{position:absolute;inset:0;border-radius:8px;border:1.5px dashed var(--line2)}
#actBtns{position:absolute;right:16px;bottom:calc(16px + 104px + 34px);z-index:13;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.btn{border:1px solid var(--line2);background:var(--glass);border-radius:12px;padding:9px 16px;font-weight:800;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s,opacity .15s,transform .12s;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn:hover{background:var(--glass2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(#f3c461,#d99a2b);border-color:#f5cf7c;color:var(--goldInk);box-shadow:0 0 0 1px rgba(0,0,0,.3),0 8px 24px rgba(233,178,74,.3)}
.btn.pri:hover{background:linear-gradient(#f8d27a,#e2a638)}
.btn.big{font-size:15px;padding:12px 22px;border-radius:14px}
.btn[disabled]{opacity:.35;pointer-events:none}
.brow{display:flex;gap:8px}
#playLbl{position:absolute;z-index:11;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none;transition:opacity .2s}
.zoomctl{position:absolute;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:12}
.zoomctl button{width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:17px;font-weight:700;display:grid;place-items:center}

/* ---------- cards */
#cards{position:absolute;inset:0;pointer-events:none;z-index:25}
/* purchase in progress: the card waits above the hand until it's paid for */
#buySlot{position:absolute;left:0;top:0;z-index:24;--bw:92px;width:var(--bw);height:calc(var(--bw)*1.4);transform:translate3d(var(--bx,0),var(--by,0),0);transition:opacity .2s}
#buySlot[hidden]{display:none}
#buySlot .bs-card{position:absolute;inset:0;border-radius:calc(var(--bw)*.08);outline:2px dashed var(--gold2);outline-offset:4px;animation:bsIn .28s var(--ease)}
#buySlot .bs-card .mcard{--cw:var(--bw)}
#buySlot .bs-card .cface{filter:saturate(.8) brightness(.9)}
#buySlot.paid .bs-card .cface{filter:none}
@keyframes bsIn{from{transform:translateY(-14px) scale(.9);opacity:0}}
.bs-ring{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);background:#0b120f;border:1.5px solid var(--gold2);border-radius:14px;padding:3px 11px;font-weight:800;font-size:14px;color:var(--gold2);white-space:nowrap;display:flex;gap:4px;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.bs-ring b{color:#fff}
#buySlot.paid .bs-ring{background:var(--gold);color:var(--goldInk);border-color:var(--gold)}
#buySlot.paid .bs-ring b{color:var(--goldInk)}
.bs-x{position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:#0b120f;color:var(--muted);cursor:pointer;font-size:12px;display:grid;place-items:center;z-index:2}
.bs-x:hover{color:var(--text)}
.mghost{pointer-events:none!important;z-index:300!important;filter:drop-shadow(0 12px 18px rgba(0,0,0,.55))}
#mkt .mslot{touch-action:none}
#allc .mslot{touch-action:pan-y}
.card{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);font-size:calc(var(--cw)*.1);transform-origin:50% 50%;will-change:transform;pointer-events:auto;cursor:pointer;touch-action:none}
.card.anim{transition:transform .32s var(--ease),opacity .3s}
.card.fast{transition:transform .16s var(--ease)}
.cface{position:absolute;inset:0;border-radius:.75em;background:var(--frame);box-shadow:0 .1em 0 rgba(255,255,255,.15) inset,0 .25em .6em rgba(0,0,0,.45),0 .1em .15em rgba(0,0,0,.5);overflow:hidden;transition:box-shadow .2s,filter .2s;color:#fff}
.cface::after{content:"";position:absolute;inset:.28em;border-radius:.55em;border:.08em solid rgba(255,226,160,.55);pointer-events:none;box-shadow:inset 0 0 0 .06em rgba(0,0,0,.35)}
.k-g{--frame:linear-gradient(155deg,#5aa56c,#23583a 60%,#18402a);--body:#132a1d;--acc:#6fcf8a}
.k-b{--frame:linear-gradient(155deg,#5ea7dc,#255d91 60%,#193f66);--body:#11233a;--acc:#7ec4f5}
.k-y{--frame:linear-gradient(155deg,#f6d27a,#c98c26 60%,#8f5d12);--body:#2d1f0a;--acc:#ffd87a}
.k-x{--frame:linear-gradient(155deg,#fbf6ea,#cdbf9f 60%,#9b8b69);--body:#2a261d;--acc:#fff1c9}
.k-p{--frame:linear-gradient(155deg,#a888de,#5e3f98 60%,#3c2468);--body:#1d1430;--acc:#d7c2ff}
.c-art{position:absolute;left:.42em;right:.42em;top:.42em;height:55%;border-radius:.45em .45em .2em .2em;overflow:hidden;box-shadow:inset 0 0 0 .06em rgba(0,0,0,.4)}
.c-art svg{width:100%;height:100%;display:block}
.c-body{position:absolute;left:.42em;right:.42em;top:calc(55% + .42em);bottom:.42em;background:linear-gradient(180deg,var(--body),color-mix(in srgb,var(--body) 70%,#000));border-radius:.2em .2em .45em .45em;display:flex;flex-direction:column;align-items:center;padding:1.05em .5em .4em}
.c-title{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);background:linear-gradient(#2b2217,#15100a);border:.07em solid rgba(255,220,150,.7);color:#fbe7b8;font-family:var(--display);font-size:.98em;padding:.18em .7em .2em;border-radius:.35em;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 .15em .35em rgba(0,0,0,.5);z-index:2;letter-spacing:.01em}
/* strength badge, top left: a coin only on coin cards; machete, paddle and joker cards use their own colour and icon */

   rows top→bottom (4,5,6,7,6,5,4): jN jungle · wN water · vN village · rN rubble · cN base camp · mm mountain · ss start

const BOARDS={

 C:['j1 j1 r1 r1','j1 v1 r1 w1 w1','w1 w1 v1 v1 r1 w1','w1 v1 r1 mm w1 r1 r1','v1 r1 w1 w1 v1 v1','v1 r1 j1 v1 w1','j1 j1 w1 w1'],

 G:['j1 v1 v1 j1','j1 v2 v1 v1 j1','j2 v1 mm mm v2 j1','j1 v1 v3 c1 v1 j1 j1','j1 r1 mm v1 v2 j1','j1 j2 mm r2 j1','j1 j1 v1 j1'],

 I:['j1 j1 j1 j1','v1 j1 mm j1 j1','v1 v2 j1 mm j2 j1','v1 v2 j1 j2 c2 mm mm','v2 r3 mm mm j2 j1','w2 w1 w1 j1 j1','w2 w2 w1 j1'],

 L:['j1 j1 j1 mm','j2 c1 j1 j1 j1','j1 j1 j2 mm j1 w1','c2 j1 j1 j1 j3 w1 j1','j1 mm j1 v1 j1 w1','j1 j2 j1 c1 j1','j1 v2 j1 j1'],

function parseTok(t){
  if(t==='mm')return{type:'m',val:0};if(t[0]==='s')return{type:'s',val:0,num:+t[1]||0}; // s1–s4: numbered start spaces

}
function parseTpl(rows){

const TPL={};for(const k in BOARDS)TPL[k]=parseTpl(BOARDS[k]);

/* =========================================================
   GEOMETRY / MAP
   ========================================================= */
const SQ3=Math.sqrt(3),R=34;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const key=(q,r)=>q+','+r;
const rot=(q,r,k)=>{for(let i=0;i<k;i++){const t=q;q=-r;r=t+r;}return[q,r];};
const pxOf=(q,r)=>[R*SQ3*(q+r/2),R*1.5*r];

/* where shuffles get their randomness: Math.random in play; a seeded generator while recording or replaying a game log */
let RNG=Math.random;

const hash=(x,y)=>{let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};

/* =========================================================
   COURSES — fixed routes (no random generation).
   p: the boards in route order as [letter, q, r, rotation]; the first is start board A or B.
      (q,r) is where the board's central space goes; rotation is in 60° steps.
   e: [q,r] the middle finishing space of the El Dorado tile, next to the last board.
   s: El Dorado side, 'j' jungle or 'w' water.
   Blockades are dealt at random onto the connections when a game starts (rulebook).
   ========================================================= */
const COURSES=[
  // Positions and rotations taken from Ravensburger's setup sheet (first game); El Dorado water side on K's top-right corner.
  {id:'first',name:'First Expedition',src:'Rulebook route for your first game',diff:'Easy',
   p:[['B',0,0,2],['C',7,-3,5],['N',11,0,2],['I',14,4,2],['K',21,-1,0]],e:[25,-5],s:'w'},
];
const courseById=id=>COURSES.find(c=>c.id===id)||null;
function buildCourse(C,seed){
  const hexes=new Map(),tiles=[];
  C.p.forEach(([name,cq,cr,k],ti)=>{
    const tpl=TPL[name];if(!tpl)throw new Error('Unknown board '+name);
    if((ti===0)!==(name==='A'||name==='B'))throw new Error('A route starts with board A or B, and only there.');
    let sx=0,sy=0;
    for(const cell of tpl){const[lq,lr]=rot(cell.q,cell.r,k);const q=cq+lq,r=cr+lr,K=key(q,r);
      if(hexes.has(K))throw new Error('Boards '+tiles[hexes.get(K).tile].name+' and '+name+' overlap.');
      const[x,y]=pxOf(q,r);hexes.set(K,{...cell.d,q,r,k:K,tile:ti,x,y});sx+=x;sy+=y;}
    tiles.push({c:[cq,cr],name,k,x:sx/tpl.length,y:sy/tpl.length});
  });
  const nT=tiles.length;
  // El Dorado tile: the given space plus its two neighbours along the last board's edge
  const touch=(q,r)=>!hexes.has(key(q,r))&&DIRS.some(([a,b])=>{const n=hexes.get(key(q+a,r+b));return n&&n.tile===nT-1&&n.type!=='m';});
  const[eq,er]=C.e;if(!touch(eq,er))throw new Error('El Dorado must sit against the last board.');
  let side=null;
  for(let d=0;d<3&&!side;d++){const a=[eq+DIRS[d][0],er+DIRS[d][1]],b=[eq-DIRS[d][0],er-DIRS[d][1]];if(touch(...a)&&touch(...b))side=[a,b];}
  if(!side){const fr=DIRS.map(([a,b])=>[eq+a,er+b]).filter(c=>touch(...c));if(fr.length<2)throw new Error('No room for El Dorado there.');side=fr.slice(0,2);}
  for(const[q,r]of[[eq,er],...side]){const K=key(q,r),[x,y]=pxOf(q,r);hexes.set(K,{type:'g',sym:C.s,val:1,q,r,k:K,tile:nT,x,y});}
  // connections between consecutive boards (only these carry blockades; other touching boards are open)
  const conns=[];const edgeConn=new Map();
  for(let i=0;i<nT-1;i++)conns.push({a:i,b:i+1,edges:[]});
  for(const h of hexes.values())for(const[dq,dr]of DIRS){const n=hexes.get(key(h.q+dq,h.r+dr));
    if(n&&n.tile===h.tile+1&&n.tile<nT){conns[h.tile].edges.push([h.k,n.k]);edgeConn.set(h.k+'|'+n.k,h.tile);edgeConn.set(n.k+'|'+h.k,h.tile);}}
  conns.forEach((c,i)=>{if(c.edges.filter(([a,b])=>hexes.get(a).type!=='m'&&hexes.get(b).type!=='m').length<2)throw new Error('Boards '+tiles[i].name+' and '+tiles[i+1].name+' are not properly connected.');});
  const starts=[...hexes.values()].filter(h=>h.type==='s');
  const goals=[...hexes.values()].filter(h=>h.type==='g');
  const seen=new Set(starts.map(s=>s.k)),q=[...starts];let found=false;
  while(q.length){const h=q.shift();if(h.type==='g'){found=true;break;}
    for(const[dq,dr]of DIRS){const n=hexes.get(key(h.q+dq,h.r+dr));if(!n||seen.has(n.k)||n.type==='m'||n.type==='s')continue;seen.add(n.k);q.push(n);}}
  if(!found)throw new Error('There is no path from the start to El Dorado.');
  // start spaces numbered along their edge
  const sc=starts.reduce((a,h)=>[a[0]+h.x/starts.length,a[1]+h.y/starts.length],[0,0]);
  const ang=Math.atan2(tiles[1].y-tiles[0].y,tiles[1].x-tiles[0].x)+Math.PI/2;
  const proj=h=>(h.x-sc[0])*Math.cos(ang)+(h.y-sc[1])*Math.sin(ang);
  if(starts.every(s=>s.num))starts.sort((a,b)=>a.num-b.num);else{starts.sort((a,b)=>proj(a)-proj(b));starts.forEach((s,i)=>s.num=i+1);}
  // a random blockade on each connection
  const deal=shuffle(BLOCKADES.slice(),mulberry32(seed^0x2c1b3c6d));
  if(conns.length>deal.length)throw new Error('Too many connections for 6 blockades.');
  const blockDefs=conns.map((c,i)=>({...deal[i],conn:i}));
  const gc=goals.reduce((a,h)=>[a[0]+h.x/3,a[1]+h.y/3],[0,0]);
  const last=tiles[nT-1];let dx=gc[0]-last.x,dy=gc[1]-last.y;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
  const city={x:gc[0]+dx*R*2.5,y:gc[1]+dy*R*2.5,dx,dy};
  tiles.push({c:[eq,er],name:'El Dorado',k:0,end:true,x:gc[0],y:gc[1]});
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(const h of hexes.values()){minX=Math.min(minX,h.x-R);maxX=Math.max(maxX,h.x+R);minY=Math.min(minY,h.y-R);maxY=Math.max(maxY,h.y+R);}
  minX=Math.min(minX,city.x-R*2.6);maxX=Math.max(maxX,city.x+R*2.6);minY=Math.min(minY,city.y-R*2.6);maxY=Math.max(maxY,city.y+R*2.6);
  const pad=R*.6;minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  return{hexes,tiles,conns,edgeConn,starts:starts.map(s=>s.k),goals:goals.map(g=>g.k),blockDefs,city,endSym:C.s,minX,minY,w:maxX-minX,h:maxY-minY,route:C.p.map(x=>x[0]),name:C.name,course:C.id};
}

/* =========================================================
   RULES ENGINE — pure game logic shared by the browser and the server.
   Works on the module-level S (game state) and MAP (board built from S.course + S.seed).
   Nothing in here touches the page.
   ========================================================= */
let S=null,MAP=null;
const hexAt=k=>MAP.hexes.get(k);
const typeOf=id=>S.cards[id];
const def=id=>CT[S.cards[id]];
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const fmt=n=>(n%1?(Math.floor(n)?Math.floor(n)+'½':'½'):String(n));
function rm(arr,id){const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);}
function playerDone(p){return p.pieces.every(k=>k==='done');}
function isActive(p){return !playerDone(p)&&!p.resigned;}

function mapFor(st){return buildCourse(st.course,st.seed);}
/* ---- game logs (replays) ----
   {kind:'eldorado-replay', v:1, title, course, seed, rng, fullRace, players:[{name,color,bot}], actions:[[seat,action],…], notes:[…]}
   Every shuffle draws from a generator seeded with log.rng, so re-applying the same actions rebuilds the identical game. */
const REPLAY_MAX_ACTIONS=20000;
function replayCheck(log){
  if(!log||log.kind!=='eldorado-replay'||log.v!==1)return'Not an El Dorado game log.';
  if(!courseById(log.course))return'Unknown course: '+log.course;
  if(!Array.isArray(log.players)||log.players.length<2||log.players.length>4)return'A game log needs 2 to 4 players.';
  if(!Number.isFinite(log.seed)||!Number.isFinite(log.rng))return'The game log is missing its seeds.';
  if(log.gift&&!(CT[log.gift]&&CT[log.gift].cost))return'Unknown gift card: '+log.gift;
  if(!Array.isArray(log.actions)||log.actions.length>REPLAY_MAX_ACTIONS||!log.actions.every(x=>Array.isArray(x)&&Number.isInteger(x[0])&&x[1]&&typeof x[1].t==='string'))return'The game log has no valid list of actions.';
  return null;}
function replayStart(log){const g=mulberry32(log.rng>>>0);setRng(g);
  newGame({course:courseById(log.course),seed:log.seed,fullRace:log.fullRace!==false,players:log.players.map((p,i)=>({name:String(p.name||'Player '+(i+1)).slice(0,24),color:COLORS[i%COLORS.length].hex}))});
  // training exploration: every player starts with the same extra card, shuffled into the draw pile
  if(log.gift)for(const p of S.players)p.deck.splice(Math.floor(RNG()*(p.deck.length+1)),0,newCard(log.gift));
  return g;}
function newGame(o){

  const course=o.course||COURSES[0];
  MAP=buildCourse(course,o.seed);
  let nid=1;const cards={};const mk=t=>{const id='c'+(nid++);cards[id]=t;return id;};
  const players=o.players.map(p=>{
    const deck=[];for(let i=0;i<3;i++)deck.push(mk('explorer'));for(let i=0;i<4;i++)deck.push(mk('traveler'));deck.push(mk('sailor'));
    const pl={name:p.name,color:p.color,pieces:[],deck:shuffle(deck),hand:[],discard:[],play:[],blocks:[],fin:0,resigned:0};
    if(p.ai&&aiById(p.ai))pl.ai=p.ai; // a named AI plays this seat (engine_ai.js)
    return pl;
  });
  const st=MAP.starts;
  if(players.length===2){players[0].pieces=[st[0],st[2]];players[1].pieces=[st[1],st[3]];}
  else players.forEach((p,i)=>p.pieces=[st[i]]);
  S={v:5,seed:o.seed,course,players,cards,nid,market:MARKET0.map(t=>({t,n:3})),reserve:RESERVE0.map(t=>({t,n:3})),
     blockades:MAP.blockDefs.map(d=>({...d,owner:null})),cur:0,start:0,round:1,endTriggered:false,over:false,winners:null,places:null,
     fullRace:o.fullRace!==false,turn:{bought:false,active:null,pending:null},trash:[],log:[],privacy:!!o.privacy,resigns:0};
  players.forEach(p=>drawCards(p,4));
  log(null,'The expedition sets out: '+players.map(p=>p.name).join(', ')+'. Course: '+MAP.name+' ('+MAP.route.join(' · ')+' · El Dorado).');
  return S;
}
function newCard(t){const id='c'+(S.nid++);S.cards[id]=t;return id;}
function drawCards(p,n){const got=[];for(let i=0;i<n;i++){if(!p.deck.length){if(!p.discard.length)break;p.deck=shuffle(p.discard);p.discard=[];}const c=p.deck.pop();p.hand.push(c);got.push(c);}return got;}
function log(pi,t){S.log.push({p:pi,t,r:S.round});if(S.log.length>200)S.log.shift();}
function occupied(k,exPl,exPi){return S.players.some((p,pi)=>p.pieces.some((pk,i)=>pk===k&&!(pi===exPl&&i===exPi)));}
function blockAt(a,b){const c=MAP.edgeConn.get(a+'|'+b);if(c===undefined)return null;const bi=S.blockades.findIndex(x=>x.conn===c);if(bi<0||S.blockades[bi].owner!==null)return null;return bi;}
function neighbors(k){const nb=MAP._nb||(MAP._nb=new Map());let r=nb.get(k);if(!r){const h=hexAt(k);r=DIRS.map(([dq,dr])=>key(h.q+dq,h.r+dr)).filter(n=>MAP.hexes.has(n));nb.set(k,r);}return r;} // cached per map
function coinVal(id){const d=def(id);if(d.c==='y'||d.c==='x')return d.p;return .5;}
function blkLabel(B){return B.k==='r'?'discard '+plural(B.v,'card'):plural(B.v,SYMNAME[B.k]);}

/* ---------- reachability ---------- */
function reach(pl,pi,syms,budget){
  const out=new Map();const from=S.players[pl].pieces[pi];if(!from||from==='done')return out;
  for(const sym of syms){
    const dist=new Map([[from,0]]),prev=new Map(),pq=[[0,from]];
    while(pq.length){
      let bi=0;for(let i=1;i<pq.length;i++)if(pq[i][0]<pq[bi][0])bi=i;
      const[d,u]=pq[bi];pq[bi]=pq[pq.length-1];pq.pop();if(d>dist.get(u))continue;
      if(u!==from&&hexAt(u).type==='g')continue;
      for(const n of neighbors(u)){
        const h=hexAt(n);
        if(!(h.type===sym||(h.type==='g'&&h.sym===sym)))continue;
        if(occupied(n,pl,pi))continue;
        let c=h.val;const b=blockAt(u,n);
        if(b!==null){if(S.blockades[b].k!==sym)continue;c+=S.blockades[b].v;}
        const nd=d+c;if(nd>budget)continue;
        if(!dist.has(n)||nd<dist.get(n)){dist.set(n,nd);prev.set(n,u);pq.push([nd,n]);}
      }
    }
    const pathTo=k=>{const p=[];let x=k;while(x!==from){p.unshift(x);x=prev.get(x);}return p;};
    for(const[k,d]of dist){if(k===from)continue;const o=out.get(k);if(!o||d<o.cost)out.set(k,{kind:'move',cost:d,sym,path:pathTo(k),pi});}
    for(const[k,d]of dist){
      if(hexAt(k).type==='g')continue;
      for(const n of neighbors(k)){const b=blockAt(k,n);if(b===null)continue;const B=S.blockades[b];
        if(B.k!==sym||d+B.v>budget)continue;const K='B'+b;const o=out.get(K);
        if(!o||d+B.v<o.cost)out.set(K,{kind:'bl',bl:b,cost:d+B.v,sym,path:k===from?[]:pathTo(k),pi});}
    }
  }
  return out;
}
function nativeTargets(pl,pi){
  const T=new Map();const pk=S.players[pl].pieces[pi];if(!pk||pk==='done')return T;
  for(const n of neighbors(pk)){const h=hexAt(n);if(h.type==='m'||h.type==='s'||occupied(n))continue;T.set(n,{kind:'native',path:[n],cost:0,pi,bl:blockAt(pk,n)});}
  for(const n of neighbors(pk)){const b=blockAt(pk,n);if(b!==null&&!T.has('B'+b))T.set('B'+b,{kind:'nativebl',bl:b,path:[],cost:0,pi});}
  return T;
}
/* spaces/blockades entered by discarding (rubble, grey blockade) or removing cards (base camp) */
function payTargets(pl,pi){
  const T=new Map();const P=S.players[pl];const pk=P.pieces[pi];if(!pk||pk==='done')return T;
  const hn=P.hand.length;
  for(const n of neighbors(pk)){const h=hexAt(n);
    if((h.type==='r'||h.type==='c')&&!occupied(n)&&blockAt(pk,n)===null&&hn>=h.val)T.set(n,{kind:h.type==='r'?'rubble':'camp',need:h.val,path:[n],pi});
    const b=blockAt(pk,n);if(b!==null&&S.blockades[b].k==='r'&&hn>=S.blockades[b].v&&!T.has('B'+b))T.set('B'+b,{kind:'blr',bl:b,need:S.blockades[b].v,pi});
  }
  return T;
}

/* =========================================================
   APPLY AN ACTION. Returns {ok, err?, ev:[events], reveal}
   reveal = new information came out (cards drawn), so undo stops here.
   Actions (acting player = S.cur):
     {t:'move', card, pi, to}        movement card (or a card with leftover strength)
     {t:'native', card, pi, to}
     {t:'pay', pi, to, cards}        rubble / base camp / grey blockade
     {t:'action', card}              Cartographer, Compass, Scientist, Travel Log
     {t:'trash', cards}              finish Scientist / Travel Log
     {t:'transmit', card, src, idx}
     {t:'buy', src, idx, cards}
     {t:'end', keep}                 end the turn, keeping these hand cards
   ========================================================= */
function applyAction(seat,a){
  const fail=err=>({ok:false,err,ev:[]});
  if(!S||S.over)return fail('The game is over.');
  if(seat!==S.cur)return fail('It is not your turn.');
  if(!a||typeof a!=='object')return fail('Bad action.');
  const P=S.players[seat],T=S.turn,ev=[];let reveal=false;
  const inHand=id=>typeof id==='string'&&P.hand.includes(id);
  const distinctHand=ids=>Array.isArray(ids)&&new Set(ids).size===ids.length&&ids.every(inHand);
  const pieceOk=pi=>Number.isInteger(pi)&&pi>=0&&pi<P.pieces.length&&P.pieces[pi]!=='done';
  if(T.pending&&a.t!=='trash')return fail('Choose which cards to remove first.');
  const takeBlock=b=>{const B=S.blockades[b];if(B.owner!==null)return;B.owner=seat;P.blocks.push(b);log(seat,'tears down blockade #'+B.n+' and keeps it.');ev.push({e:'block',pl:seat,n:B.n});};
  const arrive=pi=>{if(P.pieces[pi]!=='done')return;log(seat,'reaches El Dorado!');ev.push({e:'arrive',pl:seat,pi});
    if(playerDone(P)&&!P.fin){P.fin=S.round;checkEnd();}};
  switch(a.t){
    case 'move':{
      const act=T.active&&T.active.id===a.card?T.active:null;
      if(!act&&!inHand(a.card))return fail('That card is not in your hand.');

    for(const[k,v]of reach(S.cur,pi,syms,budget))T.set(k,v);
    // a card from hand can also be dropped onto rubble / base camp / a rubble blockade next to the explorer
    if(!isAct&&cur().hand.includes(id))for(const[k,v]of payTargets(S.cur,UI.piece))if(!T.has(k))T.set(k,v);
  }else if(UI.mode==='idle'){
    for(const[k,v]of payTargets(S.cur,UI.piece))T.set(k,v);
  }else if(UI.mode==='discardFor'&&UI.pending){T.set(UI.pending.tk,UI.pending);}
}
function cardUsable(id){
  const t=typeOf(id),d=CT[t],pl=cur();if(!d)return false;const pk=pl.pieces[UI.piece];
  if(!pk||pk==='done')return d.c==='p'&&t!=='native';
  if(t==='native')return nativeTargets(S.cur,UI.piece).size>0;
  if(d.c==='p')return true;
  if(payTargets(S.cur,UI.piece).size)return true;
  return reach(S.cur,UI.piece,d.s==='*'?['j','w','v']:[d.s],d.p).size>0;
}
const isTargeted=id=>{const d=def(id);return d&&(d.c!=='p'||typeOf(id)==='native');};
function firstPiece(){return Math.max(0,cur().pieces.findIndex(k=>k!=='done'));}
/* after the state changed, put the UI into the matching mode */
function syncMode(turnChanged){
  if(!S)return;
  if(turnChanged||!canAct()){UI.mode='idle';UI.card=null;UI.picks=[];UI.buy=null;UI.pending=null;}
  if(S.turn.pending){UI.mode='trashPick';UI.max=S.turn.pending.max;if(turnChanged)UI.picks=[];}
  else if(UI.mode==='trashPick'){UI.mode='idle';UI.picks=[];}
  if(S.turn.active&&canAct()){UI.mode='card';UI.card=S.turn.active.id;UI.piece=S.turn.active.pi;}
  else if(UI.mode==='card'&&(!UI.card||!cur().hand.includes(UI.card))){UI.mode='idle';UI.card=null;}
  if(turnChanged||cur().pieces[UI.piece]==='done'||UI.piece>=cur().pieces.length)UI.piece=firstPiece();
}
/* animations and messages for engine events; call BEFORE render so the market DOM is still the old one */
function playEvents(ev,viewer){
  for(const e of ev||[]){
    sfxEvent(e,viewer);
    const watched=feedWatch(e.pl); // another player's turn: shown in the row under the prompt (ui_view.js)
    if(e.e==='play'&&!watched)feedClear(); // I (or a pass-and-play human here) act: the last recap goes
    if(watched)feedEvent(e);
    if(e.e==='move')animatePiece(e.pl,e.pi,e.path);
    else if(e.e==='block'){if(!watched)toast(S.players[e.pl].name+' claims blockade #'+e.n);}
    else if(e.e==='arrive')toast(S.players[e.pl].name+' reaches El Dorado!',2200);
    else if(e.e==='gain'&&(viewer===undefined||viewer===e.pl))flyToDiscard(e.t,takeBuyFrom()||marketRect(e.src,e.idx));
    else if(e.e==='timeout')toast(S.players[e.pl].name+' ran out of time');
    else if(e.e==='resign')toast(S.players[e.pl].name+' left the game');
  }
}
function act(a){
  if(!S||!canAct())return;
  if(online()){NET.busy=true;netSend({t:'act',a});render();return;}
  const prevCur=S.cur,prevRound=S.round;
  snapshot();
  const r=applyAction(S.cur,a);
  if(!r.ok){undoStack.pop();sfx('error');toast(r.err);render();return;}
  if(r.reveal||S.cur!==prevCur)undoStack=[];
  playEvents(r.ev);
  afterLocalChange(S.cur!==prevCur||S.round!==prevRound);
}
function afterLocalChange(turnChanged){
  UI.picks=[];UI.buy=null;UI.pending=null;if(['pay','discardFor','transmit','endTurn'].includes(UI.mode)){UI.mode='idle';UI.card=null;}
  if(!turnChanged){syncMode(false);render();}
  else{
    syncMode(true);
    // hide the hand between human players only (pass-and-play); AI turns never need it
    if(S.privacy&&!S.over&&!isAI(S.cur)&&S.players.filter(p=>!p.ai).length>1)UI.cover=true;
    render();
    if(!UI.cover&&!S.over){banner(cur().name,isAI(S.cur)?'AI · Round '+S.round:'Round '+S.round);ensureVisible();}
  }
  if(S.over)setTimeout(()=>showGameOver(),600);
}

/* ---------- UI actions (build an action from the current selection) ---------- */
function doMove(tk){
  if(UI.mode==='discardFor')return; // the pending space itself: cards are dragged or tapped in
  const tg=UI.targets.get(tk);if(!tg)return;
  if(isDisc(tg)){startDiscard(tk,UI.card&&cur().hand.includes(UI.card)?UI.card:null);return;}
  if(tg.kind==='native'||tg.kind==='nativebl')act({t:'native',card:UI.card,pi:tg.pi,to:tk});
  else act({t:'move',card:UI.card,pi:tg.pi,to:tk});
}
const isDisc=tg=>!!tg&&(tg.kind==='rubble'||tg.kind==='camp'||tg.kind==='blr');
/* Rubble / base camp / rubble blockade: each card dragged (or tapped) onto the space counts toward its cost.
   The move happens as soon as enough cards are in. */
function startDiscard(tk,firstId){
  const tg=UI.targets.get(tk);if(!isDisc(tg))return;
  UI.mode='discardFor';UI.pending={tk,...tg};UI.card=null;UI.picks=[];
  if(firstId)addDiscard(firstId);else render();
}
function addDiscard(id){
  const P=UI.pending;if(!P||!cur().hand.includes(id))return;sfx('discard');
  if(!UI.picks.includes(id)&&UI.picks.length<P.need)UI.picks.push(id);
  if(UI.picks.length>=P.need){confirmDiscardFor();return;}
  render();pulseDiscard();
}
function confirmDiscardFor(){const P=UI.pending;if(!P||UI.picks.length!==P.need)return;sfx(P.kind==='camp'?'trash':'discard');act({t:'pay',pi:P.pi,to:P.tk,cards:UI.picks.slice()});}
function playAction(id){
  const t=typeOf(id);
  if(t==='native'){UI.mode='card';UI.card=id;render();return;}
  if(t==='transmitter'){UI.mode='transmit';UI.card=id;render();openAll(true);return;}
  act({t:'action',card:id});
}
function confirmTrash(){if(UI.picks.length)sfx('trash');act({t:'trash',cards:UI.picks.slice()});}
function pickFromMarket(src,idx){
  if(!canAct()){sfx('error');toast('Wait for your turn to buy.');return;}
  const stack=src==='m'?S.market[idx]:S.reserve[idx];if(!stack||stack.n<=0)return;
  if(UI.mode==='transmit'){openAll(false);act({t:'transmit',card:UI.card,src,idx});return;}
  if(S.turn.bought){sfx('error');toast('You can buy only one card per turn.');return;}
  if(src==='r'&&!S.market.some(s=>s.n===0)){sfx('error');toast('The reserve opens once a market slot is empty.');return;}
  if(UI.mode==='pay'&&UI.buy.src===src&&UI.buy.idx===idx){cancelMode();return;}
  UI.mode='pay';UI.buy={src,idx,t:stack.t};UI.picks=[];UI.card=null;
  render();
}
function payTotal(){return UI.picks.reduce((a,id)=>a+coinVal(id),0);}
let buyFrom=null;const takeBuyFrom=()=>{const r=buyFrom;buyFrom=null;return r&&Date.now()-r.at<3000?r:null;};
function confirmBuy(){const B=UI.buy;if(!B||payTotal()<CT[B.t].cost)return;{const e=document.querySelector('#buySlot .mcard');if(e){const r=e.getBoundingClientRect();buyFrom={left:r.left,top:r.top,width:r.width,height:r.height,at:Date.now()};}}act({t:'buy',src:B.src,idx:B.idx,cards:UI.picks.slice()});}
function cancelMode(){
  if(S&&S.turn.pending)return;
  UI.mode='idle';UI.card=null;UI.picks=[];UI.buy=null;UI.pending=null;render();
}
/* cards the player to act could buy right now with the cards in hand */
function affordable(){
  if(!S||S.over||UI.cover||!canAct()||S.turn.bought)return[];
  const cash=cur().hand.reduce((a,id)=>a+coinVal(id),0),open=S.market.some(s=>s.n===0),out=[];
  S.market.forEach((s,i)=>{if(s.n>0&&CT[s.t].cost<=cash)out.push({src:'m',idx:i,t:s.t});});
  if(open)S.reserve.forEach((s,i)=>{if(s.n>0&&CT[s.t].cost<=cash)out.push({src:'r',idx:i,t:s.t});});
  return out;
}
function startEndTurn(){
  if(!canAct()||S.turn.pending)return;
  if(UI.mode!=='buyWarn'&&affordable().length){UI.mode='buyWarn';UI.card=null;UI.picks=[];UI.buy=null;render();return;} // nudge before skipping a purchase
  if(cur().hand.length){UI.mode='endTurn';UI.picks=[];UI.card=null;render();}
  else finishTurn();
}
function finishTurn(){act({t:'end',keep:UI.mode==='endTurn'?UI.picks.slice():[]});}
function undo(){
  if(!canAct())return;
  if(online()){if(NET.canUndo){NET.busy=true;netSend({t:'undo'});}return;}
  if(!undoStack.length)return;
  S=JSON.parse(undoStack.pop());UI.picks=[];UI.buy=null;UI.pending=null;UI.mode='idle';UI.card=null;
  syncMode(false);render();
}
const canUndo=()=>online()?NET.canUndo:undoStack.length>0;

/* =========================================================
   LOCAL AI SEATS (engine_ai.js). The AI decides with the shared engine in this page and plays through the
   same applyAction as everyone else, one action at a time with a short pause so the table can follow.
   ========================================================= */
const AIX={timer:0,mem:{},net:null,loading:null,failed:false,gen:0};
function aiNetLoad(){ // the neural network (~340 KB) is only fetched once a network AI is about to play
  if(AIX.net)return Promise.resolve(AIX.net);
  if(!AIX.loading)AIX.loading=(async()=>{
    let bin;
    if(AI_NET.b64){const s=atob(AI_NET.b64);bin=new Uint8Array(s.length);for(let i=0;i<s.length;i++)bin[i]=s.charCodeAt(i);}
    else{const r=await fetch(AI_NET.url);if(!r.ok)throw new Error('HTTP '+r.status);bin=new Uint8Array(await r.arrayBuffer());}
    AIX.net=aiNetDecode(bin);return AIX.net;
  })().catch(e=>{AIX.failed=true;AIX.loading=null;console.warn('AI network unavailable:',e);toast('The AI network could not load; the AIs play with the route planner.',3200);return null;});
  return AIX.loading;
}
function aiReset(){clearTimeout(AIX.timer);AIX.timer=0;AIX.mem={};AIX.gen++;} // a new game (or a loaded one) starts
/* called after every render: if an AI is to move in a local game, schedule its next action */
function aiKick(){
  if(AIX.timer||!S||S.over||online()||REPLAY||!isAI(S.cur))return;
  const seat=S.cur,round=S.round,gen=AIX.gen,first=!S.turn.active&&!S.players[seat].play.length&&!S.turn.bought;
  const go=async()=>{
    if(gen!==AIX.gen)return;
    if(UI.anim){AIX.timer=setTimeout(go,120);return;} // let a moving explorer finish first (thinking can take a frame or two)
    const id=S&&S.players[seat]&&S.players[seat].ai;
    if(!id||S.over||online()||REPLAY||S.cur!==seat||S.round!==round){AIX.timer=0;aiKick();return;}
    if(aiUsesNet(id)&&!AIX.net&&!AIX.failed)await aiNetLoad();
    if(gen!==AIX.gen)return;
    if(!S||S.over||online()||REPLAY||S.cur!==seat){AIX.timer=0;return;}
    aiSetNet(AIX.net);
    const prevCur=S.cur,prevRound=S.round,mem=AIX.mem[seat]||(AIX.mem[seat]={});
    const r=aiStep(id,mem);
    undoStack=[];AIX.timer=0;
    playEvents(r.ev,viewIdx()); // the AI's purchases don't fly into the human's discard pile
    afterLocalChange(S.cur!==prevCur||S.round!==prevRound);
  };
  AIX.timer=setTimeout(go,reduceMotion?250:first?1000:750); // paced so the table can follow each card
}

/* =========================================================
   SOUND: tiny synthesized UI effects (Web Audio, no files).
   sfx(name[,n]) plays one; everything is short, soft and low-passed.
   The AudioContext is created on the first user gesture; any failure is silent.
   ========================================================= */
const SND={ctx:null,out:null,noise:null,muted:false,last:{},prevCur:null,moveEnd:0};
try{SND.muted=localStorage.getItem('eldorado-sound')==='0';}catch(e){}
const sndStill=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
function sndInit(){
  if(SND.ctx){if(SND.ctx.state==='suspended')SND.ctx.resume().catch(()=>{});return;}
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=new AC(),lp=c.createBiquadFilter(),g=c.createGain();
    lp.type='lowpass';lp.frequency.value=6000;g.gain.value=.5; // voices peak ≤ .12 → ≈ −24 dBFS at the output
    g.connect(lp);lp.connect(c.destination);
    const b=c.createBuffer(1,c.sampleRate>>1,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    SND.ctx=c;SND.out=g;SND.noise=b;
  }catch(e){SND.ctx=null;}
}
/* one enveloped oscillator: f → f2 over dur, soft attack, exponential decay */
function sndTone(t,f,dur,peak,type,f2,cut){
  const c=SND.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let n=o;if(cut){const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut;o.connect(lp);n=lp;}
  n.connect(g);g.connect(SND.out);o.start(t);o.stop(t+dur+.02);
}
/* one filtered noise burst; f2 sweeps the filter */
function sndNoise(t,dur,peak,type,f,q,f2,atk){
  const c=SND.ctx,s=c.createBufferSource(),bq=c.createBiquadFilter(),g=c.createGain();
  s.buffer=SND.noise;bq.type=type;bq.frequency.setValueAtTime(f,t);if(f2)bq.frequency.exponentialRampToValueAtTime(f2,t+dur);bq.Q.value=q||1;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+(atk||.003));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bq);bq.connect(g);g.connect(SND.out);s.start(t,Math.random()*.3);s.stop(t+dur+.02);
}
const SFX={
  tap(t,r){sndTone(t,1150*r,.035,.05,'triangle',720*r,3000);sndNoise(t,.022,.035,'bandpass',2800*r,1.6);},
  pick(t,r){sndNoise(t,.09,.06,'bandpass',1500*r,1.2,3400*r,.012);},
  step(t,r){sndTone(t,170*r,.07,.09,'sine',105*r);sndNoise(t,.045,.04,'lowpass',650*r,.7);},
  buy(t,r){sndTone(t,1320*r,.16,.055);sndTone(t+.045,1980*r,.18,.04);},
  discard(t,r){sndNoise(t,.11,.065,'bandpass',1300*r,.9,560*r,.008);},
  trash(t,r){sndTone(t,112*r,.16,.12,'sine',68*r);sndNoise(t,.06,.05,'lowpass',380*r,.7);},
  block(t,r){sndTone(t,330*r,.08,.07,'triangle',180*r,1800);sndNoise(t,.035,.07,'bandpass',1500*r,3);sndTone(t,92*r,.13,.08);},
  tick(t,r){sndNoise(t,.018,.028,'bandpass',3800*r,1.5);sndTone(t,1750*r,.016,.012,'triangle',0,3000);},
  turn(t,r){[659,880].forEach((f,i)=>{sndTone(t+i*.11,f*r,.34,.045);sndTone(t+i*.11,2*f*r,.2,.006);});},
  arrive(t,r){[523,659,784].forEach((f,i)=>sndTone(t+i*.09,f*r,.36,.05,'triangle',0,2400));},
  win(t,r){[262,330,392,523].forEach((f,i)=>{sndTone(t+i*.07,f*r,.86-i*.07,.04,'triangle',0,2000);sndTone(t+i*.07,2*f*r,.3,.008);});},
  error(t,r){sndTone(t,220*r,.12,.07,'sine',165*r);sndTone(t,110*r,.1,.03,'triangle',0,600);},
  timer(t,r){sndNoise(t,.015,.03,'bandpass',2500*r,4);sndTone(t,1200*r,.02,.018);}
};
const SND_TUNED={turn:1,arrive:1,win:1};
/* sfx(name) plays a sound; for 'move' and 'draw', n is the number of steps / cards (staggered) */
function sfx(name,n){
  try{
    const c=SND.ctx;if(SND.muted||!c||c.state!=='running'||!SFX[name==='move'?'step':name==='draw'?'tick':name])return;
    const now=performance.now();if(now-(SND.last[name]||0)<40)return;SND.last[name]=now;
    const t0=c.currentTime+.005,rnd=()=>1+(Math.random()*2-1)*(SND_TUNED[name]?.01:.03);
    if(name==='move'){ // one soft knock as the explorer lands on each space (see animatePiece: 200 ms per step)
      const k=sndStill?1:Math.min(n||1,8);for(let i=0;i<k;i++)SFX.step(t0+(sndStill?0:i*.2+.17),rnd());return;}
    if(name==='draw'){const k=Math.min(n||1,5);for(let i=0;i<k;i++)SFX.tick(t0+i*.055,rnd());return;}
    SFX[name](t0,rnd());
  }catch(e){}
}
/* engine events → sounds (called from playEvents) */
function sfxEvent(e,viewer){
  const mine=pl=>!online()||(S.owners&&S.owners[pl]===myId());
  if(e.e==='move'){sfx('move',e.path.length-1);SND.moveEnd=performance.now()+(sndStill?0:e.path.length*200);}
  else if(e.e==='block')sfx('block');
  else if(e.e==='arrive')setTimeout(()=>sfx('arrive'),Math.max(0,(SND.moveEnd||0)-performance.now()));
  else if(e.e==='gain')sfx('buy');
  else if(e.e==='draw'&&(viewer===undefined||viewer===e.pl))sfx('draw',e.n);
  else if(e.e==='over')setTimeout(()=>sfx('win'),350);
  else if(e.e==='turn'&&!S.over){
    // the player whose turn just ended drew a fresh hand; the new player gets a chime
    const ended=online()?SND.prevCur:null;
    if(!online()||(ended!==null&&mine(ended)))sfx('draw',4);
    if(mine(e.pl))setTimeout(()=>sfx('turn'),online()?0:260);
  }
  if(e.e==='turn')SND.prevCur=e.pl;
}
function setSound(on){
  SND.muted=!on;try{localStorage.setItem('eldorado-sound',on?'1':'0');}catch(e){}
  const b=document.getElementById('sndBtn');if(b){b.classList.toggle('off',!on);b.title=b.ariaLabel=on?'Mute sounds':'Unmute sounds';}
}
(()=>{
  // first gesture unlocks audio; then a soft tick for every button, a paper swish for picking a card
  const down=e=>{
    sndInit();
    const tg=e.target&&e.target.closest?e.target:null;if(!tg)return;
    if(tg.closest('button:not(:disabled)')){if(!tg.closest('#sndBtn'))sfx('tap');return;}
    if(!S||S.over||UI.cover||UI.anim||!canAct())return;
    if(tg.closest('#cards .card')||tg.closest('#market [data-src],#reserve [data-src],#allMarket [data-src]'))sfx('pick');
  };
  document.addEventListener('pointerdown',down,true);
  document.addEventListener('keydown',()=>sndInit(),true);
  const b=document.getElementById('sndBtn');
  if(b){setSound(!SND.muted);b.onclick=()=>{setSound(SND.muted);if(!SND.muted)sfx('tap');};}
})();

/* =========================================================

const artSun=(x,y,r,col)=>`<circle cx="${x}" cy="${y}" r="${r*2.2}" fill="url(#aglow)"/><circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`;

const artCanopy=(y,col,op=1,seed=0)=>{let d=`M0 70 V${y}`;for(let x=0;x<=100;x+=9){const h=4+((x*7+seed*13)%5);d+=` Q${x+4.5} ${y-h} ${x+9} ${y}`;}return`<path d="${d} V70Z" fill="${col}" opacity="${op}"/>`;};
const artFern=(x,y,s,flip,col)=>`<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})" fill="${col}"><path d="M0 0 Q4 -10 14 -16 Q8 -8 0 0Z"/><path d="M0 0 Q9 -4 18 -6 Q9 -1 0 0Z"/><path d="M0 0 Q1 -12 6 -22 Q4 -10 0 0Z"/></g>`;

/* =========================================================
   MEEPLES — four explorer figures, one per player colour (crimson, ivory, violet, orange):
   0 man in a pith helmet, 1 woman in a wide-brim hat, 2 bearded man in a fedora,
   3 woman in a headscarf with a lantern. Three angular design languages (style):
     'carved' faceted low-poly wooden figurines, flat-shaded planes
     'standee' travel-poster cut-out silhouettes in a pose, on a slotted base
     'idol'   frontal stepped glyph figures with gold inlay, on a ziggurat base
     'board'  (D) the carved figure in the board's gradient + shine + dark-rim language, on a hex plinth
   Board units (hex radius 34); feet/base centred near (0, 11), about 30 × 44 units.
   The whole figure is made of the player colour (shades mixed in JS); dark outline for every terrain.
   Plain polygons/paths only — no filters, no gradients.
   ========================================================= */
const MEEPLE_STYLE='board';
const MEEPLE_INK='#0d110f';
const MEEPLE_GOLD='@l2';
function meepleMix(hex,to,t){
  const n=parseInt(hex.slice(1),16),m=parseInt(to.slice(1),16);
  const ch=s=>{const a=(n>>s)&255,b=(m>>s)&255;return Math.round(a+(b-a)*t);};
  return'#'+((1<<24)|(ch(16)<<16)|(ch(8)<<8)|ch(0)).toString(16).slice(1);
}
const mpE=(tag,a)=>'<'+tag+Object.entries(a).map(([k,v])=>` ${k}="${v}"`).join('')+'/>';
// polygon / path with a crisp mitred outline (sw 0 = no outline)
const mpG=(pts,fill,sw=1.2,x={})=>mpE('polygon',{points:pts,fill,stroke:sw?MEEPLE_INK:'none','stroke-width':sw,'stroke-linejoin':'miter','stroke-miterlimit':6,...x});
const mpA=(d,fill,sw=1.2,x={})=>mpE('path',{d,fill,stroke:sw?MEEPLE_INK:'none','stroke-width':sw,'stroke-linejoin':'miter','stroke-miterlimit':6,...x});
const mpLine=(d,col,w,x={})=>mpE('path',{d,fill:'none',stroke:col,'stroke-width':w,'stroke-linecap':'square','stroke-linejoin':'miter',...x});
function meepleBadge(num,lt,x,y){
  if(!num)return'';
  const r=4.8,p=[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i+Math.PI/6;return(x+r*Math.cos(a)).toFixed(2)+','+(y+r*Math.sin(a)).toFixed(2);}).join(' ');
  return mpG(p,MEEPLE_INK,1,{stroke:lt})+`<text x="${x}" y="${y+2.5}" text-anchor="middle" font-size="7" font-weight="800" fill="#fff" font-family="Figtree, sans-serif">${num}</text>`;
}

/* ---------- A: carved, faceted wooden figurine ---------- */
function meepleCarved(v,K,plinth){
  const{c,lt,dk,dk2,skin,skinDk,hair}=K,woman=v===1||v===3;let s='';
  if(plinth)s+=plinth;else{
  // hexagonal prism base: sides (3 shaded facets) + top (2 facets)
  s+=mpG('-12.5,10.5 -6.5,14.2 6.5,14.2 12.5,10.5 12.5,13.8 6.5,17.5 -6.5,17.5 -12.5,13.8',dk2,1.4);
  s+=mpG('-12.5,10.5 -6.5,14.2 -6.5,17.5 -12.5,13.8','@m1',0);
  s+=mpG('-6.5,14.2 6.5,14.2 6.5,17.5 -6.5,17.5',dk,0);
  s+=mpG('-12.5,10.5 -6.5,6.8 6.5,6.8 12.5,10.5 6.5,14.2 -6.5,14.2',c,1.2);
  s+=mpG('-12.5,10.5 -6.5,6.8 6.5,6.8 12.5,10.5',lt,0);}
  // headscarf tails behind (v3)
  if(v===3)s+=mpG('5.6,-18 12,-14.8 9.4,-13.8 11.2,-10.4 6,-13.4','@d2',1.1);
  // legs + boots
  s+=mpA(woman?'M-4.4 6 L-0.8 6 L-1 10.2 L-4.2 10.2 Z M0.8 6 L4.4 6 L4.2 10.2 L1 10.2 Z':'M-5.2 3.6 L-0.8 3.6 L-1 10.2 L-4.6 10.2 Z M0.8 3.6 L5.2 3.6 L4.6 10.2 L1 10.2 Z','@d1',1.1);
  s+=mpA('M-5 8.2 L-0.8 8.2 L-0.8 11.6 L-6 11.6 Z M0.8 8.2 L5 8.2 L6 11.6 L0.8 11.6 Z','@d3',1.1);
  // arms (rolled sleeves on v2 show skin forearms)
  const aL='-7,-5.2 -10.4,3 -8,3.8 -5.4,-1.6',aR='7,-5.2 10.4,3 8,3.8 5.4,-1.6';
  if(v===2){s+=mpG(aL,skin,1.1)+mpG(aR,skinDk,1.1)+mpG('-7,-5.2 -8.8,-0.6 -6.2,0.2 -5.4,-1.6',lt,1.1)+mpG('7,-5.2 8.8,-0.6 6.2,0.2 5.4,-1.6',dk,1.1);}
  else s+=mpG(aL,lt,1.1)+mpG(aR,dk,1.1);

/* ---------- D: board-family carved figure ----------
   Style A's faceted figure rendered in the board's own language: every plane is a soft
   top-left -> bottom-right gradient of the player colour (like the hex tiles), the outline is
   a dark rim tinted with the colour (like the board plates), and it stands on a small
   pointy-top hex plinth with the tiles' white shine and the cards' gold hairline. */
const MEEPLE_PLINTH=(()=>{
  const hx=(r,ry,cy)=>[[0,-1],[.866,-.5],[.866,.5],[0,1],[-.866,.5],[-.866,-.5]].map(([a,b])=>(a*r).toFixed(2)+','+(cy+b*ry).toFixed(2)).join(' ');
  const R=14.6,Y=5,C=10.2,T=2.8,x=(R*.866).toFixed(2),a=C+Y/2,b=C+Y;
  return{top:hx(R,Y,C),gold:hx(R*.72,Y*.72,C),left:`-${x},${a} 0,${b} 0,${b+T} -${x},${a+T}`,right:`0,${b} ${x},${a} ${x},${a+T} 0,${b+T}`,
    all:`0,${C-Y} ${x},${C-Y/2} ${x},${a+T} 0,${b+T} -${x},${a+T} -${x},${C-Y/2}`};
})();

function onHandCard(id){
  if(!S||S.over||UI.cover||UI.anim||!canAct())return;
  switch(UI.mode){
    case 'pay':case 'endTurn':{togglePick(id);return;}
    case 'discardFor':{if(UI.picks.includes(id))rm(UI.picks,id);else if(UI.picks.length<UI.pending.need)UI.picks.push(id);render();return;}
    case 'trashPick':{if(UI.picks.includes(id))rm(UI.picks,id);else if(UI.picks.length<UI.max)UI.picks.push(id);render();return;}
    case 'transmit':{if(id===UI.card)cancelMode();return;}
  }
  if(UI.mode==='card'&&UI.card===id){cancelMode();return;}
  if(def(id).c==='p'&&typeOf(id)!=='native'){playAction(id);return;}
  UI.mode='card';UI.card=id;render();
}
function togglePick(id){const add=!UI.picks.includes(id);if(add)UI.picks.push(id);else rm(UI.picks,id);render();if(add&&UI.mode==='pay')payProgress();}
/* after a card goes into the spending tray: finish the purchase once the coins cover it */
function payProgress(){if(UI.mode!=='pay'||!UI.buy)return;const c=CT[UI.buy.t].cost;if(payTotal()<c)return;
  $('#buySlot').classList.add('paid');const b=UI.buy;setTimeout(()=>{if(UI.mode==='pay'&&UI.buy===b&&payTotal()>=c)confirmBuy();},300);}
function renderBuySlot(){const bs=$('#buySlot');if(!bs)return;const on=UI.mode==='pay'&&!!UI.buy&&!UI.cover;
  if(!on){if(!bs.hidden){bs.hidden=true;bs.dataset.t='';}return;}
  if(bs.dataset.t!==UI.buy.src+UI.buy.idx){bs.dataset.t=UI.buy.src+UI.buy.idx;bs.querySelector('.bs-card').innerHTML=`<div class="mcard">${cardHTML(UI.buy.t)}</div>`;}
  const c=CT[UI.buy.t].cost,t=payTotal();$('#bsPaid').textContent=fmt(t);$('#bsCost').textContent=c;bs.classList.toggle('paid',t>=c);bs.hidden=false;}
function onPlayCard(id){
  if(S.turn.active&&S.turn.active.id===id){
    if(UI.mode==='card'&&UI.card===id){UI.mode='idle';UI.card=null;}else{UI.mode='card';UI.card=id;UI.piece=S.turn.active.pi;UI.picks=[];}
    render();
  }
}
function onPiece(pl,i){
  if(!canAct())return;
  if(pl!==S.cur||S.over)return;
  if(cur().pieces[i]==='done')return;
  if(S.turn.active&&UI.mode==='card'&&UI.card===S.turn.active.id&&S.turn.active.pi!==i){UI.mode='idle';UI.card=null;}
  UI.piece=i;render();

/* =========================================================
   OTHER PLAYERS' TURNS. What an AI or an online opponent plays, spends, buys and removes is shown in a row of small
   cards under the prompt (the same card faces as your own hand), with a caption per step; played cards fly out of their
   player chip, a bought card flies out of the market, and their moves leave a dotted trail on the board. After their

function feedReset(){FEED.pl=-1;FEED.ended=false;FEED.groups=[];FEED.fly=[];FEED.trail=[];}
function feedClear(){if(FEED.pl<0&&!FEED.groups.length)return;feedReset();feedTrail();}

/* one engine event of a watched player (called from playEvents, before render) */
function feedEvent(e){
  if(e.e==='play'){
    if(FEED.pl!==e.pl||FEED.ended){feedReset();FEED.pl=e.pl;}
    const last=FEED.groups[FEED.groups.length-1];
    if(e.k==='move'&&e.more&&last&&last.k==='move'){last.n+=e.n;last.v++;return;} // leftover strength: same card, more spaces

function feedCap(g){

function feedRender(){

function drawArrow(sx,sy,ex,ey,ok,show,phase){

  const P=t=>{const u=1-t;return[u*u*u*sx+3*u*u*t*cx1+3*u*t*t*cx2+t*t*t*ex,u*u*u*sy+3*u*u*t*cy1+3*u*t*t*cy2+t*t*t*ey];};

function showRules(){
  modal(`<h2>How to play</h2><div class="rules">
  <p>Race to El Dorado: move onto one of the three finishing spaces on the El Dorado tile at the end of the route. Your explorer then steps into the city, freeing the space.</p><p><b>Game end.</b> Online games (and local games by default) continue until all but one expedition has arrived, then the round is finished; this gives every player a place. Players arriving in the same round are split by blockades held. The official rule, where the game ends after the round in which the first player arrives, is available for local games.</p><p><b>Online.</b> Each turn has a timer; when it runs out the turn ends and leftover cards are discarded. Missing 3 turns in a row forfeits. Rated games (the default) change Elo ratings; whoever creates a room can make it unrated.</p><p><b>AI players.</b> Any seat can be an AI: <b>Humboldt</b> (Master: a neural network that plans each whole turn), <b>Orellana</b> (Strong: the same network, one move at a time) or <b>Raleigh</b> (Steady: a hand-written route planner). Online, AIs play on the server and have ratings of their own. The network was trained on First Expedition; on other courses the AIs use the route planner.</p>
  <h4>Your turn</h4><ul><li><b>Play cards</b> in any order: move, play action cards, and buy <b>at most one</b> card.</li><li><b>End turn</b>: played cards go to your discard pile. You may discard any cards left in hand or keep them.</li><li><b>Draw</b> back up to 4 cards. An empty deck is refilled by shuffling your discard pile.</li></ul>
  <h4>Moving</h4><ul><li><b>Drag</b> a card onto a highlighted space, or tap the card and then the space.</li><li>A jungle, water or village space needs one card of that symbol with at least the shown strength. Cards can't be combined for one space.</li><li>Leftover strength keeps moving the same explorer over further spaces of that type. It's lost once you do something else.</li><li>Jokers (white) count as any one symbol, chosen when played.</li><li><b>Rubble</b> (grey): discard as many cards as shown — drag cards onto it one by one; you move once enough are in. <b>Base camp</b> (red): remove that many cards from the game.</li><li>Mountains are impassable. Occupied spaces can't be entered or crossed.</li></ul>
  <h4>Blockades</h4><p>At the start, a random blockade from #1–6 is placed on each connection between two boards. The first explorer to cross pays its cost (a matching card, or discards for grey ones) and keeps it; the Native can also tear one down. Ties at the end go to whoever holds the most blockades, then the highest-numbered one.</p>
  <h4>Buying</h4><ul><li>Coin cards and jokers pay their value; every other card pays ½ coin. No change.</li><li>Drag a market card toward your hand (or tap it), then drag or tap cards from your hand to pay. The purchase completes as soon as it's covered.</li><li>Bought cards go to your discard pile.</li><li>The reserve opens once a market slot is empty; that stack moves into the slot.</li></ul>
  <h4>Single-use cards</h4><p>Cards marked <b>Single use</b> are removed from the game after their effect. Spent only as ½ coin, they're discarded normally.</p>
  <h4>Two players</h4><p>Each player leads two explorers (starting spaces 1 & 3, and 2 & 4) and wins only when both reach El Dorado. Each card moves one of them.</p>
  <h4>About the boards</h4><p>Courses are fixed routes, starting with the rulebook's route for a first game (B · C · N · I · K), laid out as on the official setup sheet. Tiles B, C, I, K and N are copied space by space from the printed tiles; darker spaces are harder to cross.</p>
  <h4>Controls</h4><ul><li>Drag or scroll to pan, pinch or ctrl+scroll to zoom. <b>Esc</b> cancels, <b>Ctrl+Z</b> undoes until new cards are drawn.</li></ul>
  </div><div class="mrow"><button class="btn pri" id="rClose">Close</button></div>`,sc=>sc.querySelector('#rClose').onclick=closeModal,true);
}

   Sign in with Google → hub (profile, rooms, leaderboard) → room lobby → game.

async function api(path,opts={}){
  const headers={'content-type':'application/json'};if(NET.token)headers.authorization='Bearer '+NET.token;
  const r=await fetch(path,{...opts,headers});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j.error||('Request failed ('+r.status+')'));e.status=r.status;throw e;}
  return j;
}
async function netInit(){
  if(location.protocol==='file:'||/claude\.ai$|claudeusercontent/.test(location.hostname))return;
  try{NET.cfg=await api('/api/config');NET.available=true;}catch(e){NET.available=false;return;}
  try{NET.token=localStorage.getItem('ed-token');}catch(e){}
  if(NET.token){try{const r=await api('/api/me');NET.user=r.user;NET.active=r.active;}catch(e){if(e.status===401){NET.token=null;try{localStorage.removeItem('ed-token');}catch(_){}}}}
}
function signedIn(r){
  NET.token=r.token;NET.user=r.user;try{localStorage.setItem('ed-token',r.token);}catch(e){}
  if(r.isNew)toast('Welcome, '+r.user.name+'! You can change your name any time.',3000);
  if(NET.pendingRoom){const c=NET.pendingRoom;NET.pendingRoom=null;joinRoom(c);return;}
  showHub();
}
function signOut(){NET.token=null;NET.user=null;try{localStorage.removeItem('ed-token');}catch(e){}closeLobbyWs();showHub();}
let gsiLoading=null;
function loadGsi(){if(window.google&&google.accounts)return Promise.resolve();if(!gsiLoading)gsiLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s);});return gsiLoading;}
function wsUrl(path){return(location.protocol==='https:'?'wss://':'ws://')+location.host+path+(path.includes('?')?'&':'?')+'t='+encodeURIComponent(NET.token);}

/* ---------- hub ---------- */
let hubTab='play';

  if(!NET.available)return`<h2>Play online</h2><p class="sub">Online play runs from the game's own website. This copy can't reach the game server.</p><div class="mrow"><button class="btn" id="hBack">Back</button></div>`;

    ${NET.cfg.dev?'<div class="field" style="margin-top:16px"><label>Developer sign-in (local testing only)</label><div class="prow"><input id="devName" maxlength="16" placeholder="Name"><button class="btn" id="devGo">Sign in</button></div></div>':''}

    <div class="mrow"><button class="btn" id="hOut">Sign out</button><button class="btn" id="hBack">Back</button></div>`;
  const rooms=NET.rooms.filter(r=>r.status==='lobby');const live=NET.rooms.filter(r=>r.status==='playing');

    ${NET.active?`<div class="prow" style="padding:10px 12px;border-radius:10px;border:1px solid var(--gold);background:rgba(233,178,74,.1);justify-content:space-between"><span>You have a game in progress.</span><button class="btn pri" data-join="${NET.active}">Rejoin</button></div>`:''}

}
function showHub(){
  if(NET.user)openLobbyWs(); // also right after signing in, when the hub is already open
  if(document.querySelector('#overlay .modal.hub')){renderHub();return;}
  modal('',sc=>{sc.querySelector('.modal').classList.add('hub');renderHub();},false);
}
function renderHub(){
  const m=document.querySelector('#overlay .modal.hub');if(!m)return;
  const focus=document.activeElement&&document.activeElement.id;const jv=m.querySelector('#jCode')?.value;
  m.innerHTML=hubHTML();
  if(jv&&m.querySelector('#jCode'))m.querySelector('#jCode').value=jv;
  if(focus&&m.querySelector('#'+focus))m.querySelector('#'+focus).focus();
  const q=s=>m.querySelector(s);const err=t=>{const e=q('#hErr');if(e)e.textContent=t;};
  q('#hBack').onclick=()=>{closeLobbyWs();closeModal();setTimeout(()=>{if(!S||S.over||online())showSetup();},180);};
  if(!NET.available)return;
  if(!NET.user){
    if(NET.cfg.google)loadGsi().then(()=>{google.accounts.id.initialize({client_id:NET.cfg.google,callback:async r=>{try{signedIn(await api('/api/auth/google',{method:'POST',body:JSON.stringify({credential:r.credential})}));}catch(e){err(e.message);}}});
      const b=q('#gsiBtn');if(b)google.accounts.id.renderButton(b,{theme:'filled_black',size:'large',shape:'pill',text:'signin_with'});}).catch(()=>err('Could not load Google sign-in.'));
    const dg=q('#devGo');if(dg)dg.onclick=async()=>{try{signedIn(await api('/api/auth/dev',{method:'POST',body:JSON.stringify({name:q('#devName').value||'Tester'})}));}catch(e){err(e.message);}};
    return;
  }
  m.querySelectorAll('#hTabs button').forEach(b=>b.onclick=()=>{hubTab=b.dataset.k;renderHub();});
  if(hubTab==='board'){api('/api/leaderboard').then(r=>{const l=q('#lbList');if(!l)return;
    l.innerHTML=r.players.length?`<div style="display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 14px;font-size:14px;font-variant-numeric:tabular-nums">${r.players.map((p,i)=>{const A=p.bot&&aiById(p.bot);return`<span style="color:var(--muted)">${i+1}</span><span style="display:flex;align-items:center;gap:7px;min-width:0"><b style="${p.id===myId()?'color:var(--gold2)':''}">${esc(p.name)}</b>${A?`<span class="aitag" title="${esc(A.desc)}">AI</span><span class="note" style="margin:0">${esc(A.tier)}</span>`:''}</span><span>${Math.round(p.rating)}</span><span style="color:var(--muted)">${p.wins}/${p.games}</span>`;}).join('')}</div><p class="note" style="margin-top:12px">Wins / rated games. The AI players are rated like everyone else: beat them to gain rating. Their starting ratings come from hundreds of games against each other; Raleigh (Steady) starts where every new player does, at 1200.</p>`:'<p class="note">No rated games yet.</p>';}).catch(e=>{const l=q('#lbList');if(l)l.textContent=e.message;});return;}
  if(hubTab==='me'){q('#meSave').onclick=async()=>{try{const r=await api('/api/me',{method:'PATCH',body:JSON.stringify({name:q('#meName').value})});NET.user=r.user;toast('Saved as '+r.user.name);renderHub();}catch(e){toast(e.message);}};q('#hOut').onclick=signOut;return;}
  const seg=(id,key)=>m.querySelectorAll(id+' button').forEach(b=>b.onclick=()=>{setup[key]=+b.dataset.v;renderHub();});
  seg('#cMax','oMax');seg('#cTurn','oTurn');
  m.querySelectorAll('#cPub button').forEach(b=>b.onclick=()=>{setup.oPub=b.dataset.v==='1';renderHub();});
  m.querySelectorAll('#cRated button').forEach(b=>b.onclick=()=>{setup.oRated=b.dataset.v==='1';renderHub();});
  q('#qGo').onclick=async()=>{try{const r=await api('/api/match',{method:'POST',body:'{}'});joinRoom(r.code);}catch(e){err(e.message);}};
  m.querySelectorAll('#cCourse button').forEach(b=>b.onclick=()=>{setup.oCourse=b.dataset.c;renderHub();});
  q('#cGo').onclick=async()=>{try{const r=await api('/api/rooms',{method:'POST',body:JSON.stringify({max:setup.oMax,turn:setup.oTurn,course:setup.oCourse,pub:setup.oPub,rated:setup.oRated})});joinRoom(r.code);}catch(e){err(e.message);}};
  const jc=q('#jCode');q('#jGo').onclick=()=>{const c=(jc.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4){err('Enter the 5-letter room code.');return;}joinRoom(c);};
  jc.onkeydown=e=>{if(e.key==='Enter')q('#jGo').click();};

function openLobbyWs(){
  if(NET.lobbyWs||!NET.user)return;
  const ws=new WebSocket(wsUrl('/api/lobby/ws'));NET.lobbyWs=ws;
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.t==='rooms'){NET.rooms=m.rooms;const me=myId();renderHub();}};
  ws.onclose=()=>{if(NET.lobbyWs===ws)NET.lobbyWs=null;};
}
function closeLobbyWs(){if(NET.lobbyWs){try{NET.lobbyWs.close();}catch(e){}NET.lobbyWs=null;}}

/* ---------- room connection ---------- */
function netSend(m){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(m));else{NET.busy=false;toast('Reconnecting…');}}
function joinRoom(code){
  closeLobbyWs();leaveRoomSocket();
  NET.room={code,status:'connecting',seats:[]};NET.code=code;NET.retries=0;
  try{history.replaceState(null,'',location.pathname+'?room='+code);}catch(e){}
  connectRoom();showRoomLobby();
}
function leaveRoomSocket(){if(NET.ws){const w=NET.ws;NET.ws=null;try{w.close();}catch(e){}}clearTimeout(NET.retryT);NET.connected=false;}
function connectRoom(){
  const code=NET.code;if(!code)return;
  const ws=new WebSocket(wsUrl('/api/rooms/'+code+'/ws'));NET.ws=ws;
  ws.onopen=()=>{NET.connected=true;NET.retries=0;NET.status='';if(S)render();};
  ws.onmessage=e=>{if(e.data==='pong')return;let m;try{m=JSON.parse(e.data);}catch(_){return;}onRoomMsg(m);};
  ws.onclose=ev=>{
    if(NET.ws!==ws)return;NET.connected=false;NET.ws=null;
    if(ev.code===1000||!NET.code){return;}
    NET.status='Connection lost. Reconnecting…';if(S)render();renderRoomLobby();
    NET.retries++;if(NET.retries>8&&!S){NET.status='Could not reach this room. It may have closed.';renderRoomLobby();return;}
    NET.retryT=setTimeout(connectRoom,Math.min(8000,800*NET.retries));
  };
  clearInterval(NET.pingT);NET.pingT=setInterval(()=>{if(NET.ws&&NET.ws.readyState===1)NET.ws.send('ping');},25000);
}
function onRoomMsg(m){
  if(m.t==='error'){NET.busy=false;sfx('error');toast(m.msg);if(S)render();return;}
  if(m.t==='room'){NET.room=m.room;if(m.room.status==='closed'){NET.code=null;leaveRoomSocket();toast('The host closed the room.');closeModal();setTimeout(showHub,200);return;}renderRoomLobby();return;}
  if(m.t==='state'){NET.room=m.room;NET.seat=m.seat;NET.canUndo=!!m.undo;NET.deadline=m.deadline;NET.skew=m.now-Date.now();NET.busy=false;applyServerState(m.S,m.ev);}
}
function applyServerState(S2,ev){
  const old=S;const fresh=!old||!old.owners||old.seed!==S2.seed||old.room!==S2.room;
  S=S2;
  if(fresh){for(const[,el]of cardEls)el.remove();cardEls.clear();MAP=mapFor(S);buildBoard();closeModal();lastPlayer=-1;UI.cover=false;fit();}
  const turnChanged=fresh||old.cur!==S.cur||old.round!==S.round;
  if(!fresh)playEvents(ev,viewIdx());
  // the only thing that changes the game during my turn is me, so any new state closes pick modes
  UI.picks=[];UI.buy=null;UI.pending=null;if(['pay','discardFor','transmit','endTurn'].includes(UI.mode)){UI.mode='idle';UI.card=null;}
  syncMode(turnChanged);
  render();
  if(S.over&&(fresh||!old.over)){setTimeout(()=>showGameOver(),700);return;}
  if(turnChanged&&!S.over){banner(canAct()?'Your turn':cur().name,canAct()?'Round '+S.round:'Round '+S.round);ensureVisible();}
}
function resignOnline(){
  modal(`<h2>Leave this game?</h2><p class="sub">${NET.room&&NET.room.opts&&NET.room.opts.rated===false?'Leaving counts as finishing last among the players still racing (this game is unrated).':'Leaving a rated game counts as finishing last among the players still racing. Your rating will drop.'}</p><div class="mrow"><button class="btn" id="rsNo">Stay</button><button class="btn pri" id="rsYes">Leave game</button></div>`,sc=>{
    sc.querySelector('#rsNo').onclick=closeModal;sc.querySelector('#rsYes').onclick=()=>{netSend({t:'resign'});closeModal();};},true);
}
function exitOnline(){NET.code=null;leaveRoomSocket();S=null;try{history.replaceState(null,'',location.pathname);}catch(e){}for(const[,el]of cardEls)el.remove();cardEls.clear();}

/* ---------- pre-game room lobby ---------- */

  const r=NET.room||{};const host=r.host===myId();const link=location.origin+location.pathname+'?room='+NET.code;
  const seats=(r.seats||[]).map(s=>{const A=s.ai&&aiById(s.ai);return`<div class="prow" style="justify-content:space-between;padding:9px 12px;border-radius:10px;background:#0c1512;border:1px solid var(--line);min-height:40px;box-sizing:border-box"><span style="display:flex;align-items:center;gap:9px;min-width:0"><i style="width:13px;height:13px;border-radius:50%;background:${s.color};display:inline-block;flex:none"></i><b>${esc(s.name)}</b>${A?'<span class="aitag">AI</span>':''}${s.uid===myId()?' <span class="note" style="margin:0">(you)</span>':''}</span>${A?`<span style="display:flex;align-items:center;gap:10px"><span class="note" style="margin:0">${esc(A.tier)}</span>${host&&r.status==='lobby'?`<button class="rmai" data-rmai="${esc(s.uid)}" aria-label="Remove ${esc(s.name)}" title="Remove">×</button>`:''}</span>`:`<span class="note" style="margin:0">${s.now?'wants to start · ':''}${s.uid===r.host&&!(r.opts&&r.opts.auto)?'host · ':''}${s.online?'here':'away'}</span>`}</div>`;}).join('');
  const auto=!!(r.opts&&r.opts.auto),room=(r.seats||[]).length<(r.opts?r.opts.max:4),rated=!(r.opts&&r.opts.rated===false);
  const addAI=host&&!auto&&r.status==='lobby'?`<div class="field"><label>Add an AI player</label>${room?`<div class="clist ailist">${AIS.map(a=>{const on=(r.seats||[]).some(s=>s.ai===a.id);return`<button data-addai="${a.id}" ${on?'disabled':''}><b>${esc(a.name)} <span class="aitag">AI</span></b><span>${esc(a.tier)} · ${esc(a.desc)}</span></button>`;}).join('')}</div>`:'<p class="note">The room is full. Remove an AI to add another.</p>'}<p class="note">AI players move on the server${rated?' and gain or lose rating like everyone else':''}.</p></div>`:'';
  const ratedCtl=host&&!auto&&r.status==='lobby'?`<div class="field"><label>Rating</label><div class="seg" id="rlRated"><button data-v="1" class="${rated?'on':''}">Rated</button><button data-v="0" class="${rated?'':'on'}">Unrated</button></div></div>`:'';
  const mine=(r.seats||[]).find(s=>s.uid===myId());
  const PC=COLORS.map(c=>c.hex);
  return`<h2>Room ${esc(NET.code||'')}</h2>
  <p class="sub">${r.opts&&r.opts.auto?`Quick match: the game starts as soon as ${r.opts.max} players are here, or earlier if everyone here presses “Start now”.`:host?'Share the code or link. Start when everyone is here.':'Waiting for the host to start.'} ${r.opts?`${esc(courseName(r.opts.course))} · ${r.opts.auto?'':(r.opts.pub===false?'private · ':'public · ')+r.opts.max+' players max · '}${r.opts.turn}s per turn · ${r.opts.rated===false?'unrated':'rated'}`:''}</p>
  <div class="prow"><input id="lkIn" readonly value="${esc(link)}"><button class="btn" id="lkCopy">Copy link</button></div>
  <div class="field" style="margin-top:14px"><label>Players ${(r.seats||[]).length}/${r.opts?r.opts.max:4}</label>${seats||'<p class="note">Connecting…</p>'}</div>
  ${addAI}${ratedCtl}
  ${mine?`<div class="field"><label>Your colour</label><div class="sws">${PC.map(c=>`<button data-col="${c}" style="--c:${c}" class="${mine.color===c?'on':''}" ${(r.seats||[]).some(s=>s!==mine&&s.color===c)?'disabled':''}></button>`).join('')}</div></div>`:(r.status==='lobby'&&r.seats?'<p class="note">This room is full.</p>':'')}
  ${NET.status?`<p class="note" style="color:#f3c98b">${esc(NET.status)}</p>`:''}
  <div class="mrow"><button class="btn" id="rlLeave">${host&&!(r.opts&&r.opts.auto)?'Close room':'Leave'}</button>${r.opts&&r.opts.auto&&mine?`<button class="btn${mine.now?'':' pri'} big" id="rlNow" ${(r.seats||[]).length<2?'disabled':''}>${mine.now?'Waiting for the others… (cancel)':'Start now'}</button>`:host&&!(r.opts&&r.opts.auto)?`<button class="btn pri big" id="rlStart" ${(r.seats||[]).length<2?'disabled':''}>Start game</button>`:''}</div>`;
}

  const m=document.querySelector('#overlay .modal.roomlobby');if(!m)return;
